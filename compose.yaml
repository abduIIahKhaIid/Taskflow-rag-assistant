services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:3000}"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    init: true

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}"
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api
    init: true
